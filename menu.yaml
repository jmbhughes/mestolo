recipes:
  generator_apple:
    inputs:
      DIRECTORY: "/Users/mhughes/repos/mestolo/inputs"
      selector: "selectors.py:generator_apple"
    outputs: [apple]
    
  generator_banana:
    inputs:
      DIRECTORY: "/Users/mhughes/repos/mestolo/inputs"
      selector: "selectors.py:banana"
    outputs: [ banana ]

  level1:
    inputs:
      apple:
        count: 1
        condition: fail
        selector: "selectors.py:level1_apple"
      banana:
        count: 10
        condition:
          wait: 10
        selector: "selectors.py:level1_banana"
    outputs: [pie, peel]

  level2a:
    inputs:
      peel:
        count: 1
        condition:
          wait: 60
        selector: "selectors.py:level2a"
    outputs: [trashbag]

  level2b:
    inputs:
      pie:
        count: 10
        condition: fail
        selector: "selectors.py:level2b"
    outputs: [money]